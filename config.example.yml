# 总开关。关闭后三个功能全部失效。
is_enabled: true
# 背包权限卡自动开门：手里没卡（空手或持枪）时，用背包里权限足够的卡开门。
auto_keycard: true
# 无限子弹：换弹时补满该枪所需弹药，换完后所有弹药数量归为 1。
infinite_ammo: true
# 换弹完成 / 出生后，把每种子弹的备弹数量设为多少。默认 1。
ammo_after_reload: 1
# 无限体力：周期性把体力补满，让玩家可以一直奔跑。
infinite_stamina: true
# 体力补充间隔（秒）。越小越顺滑，但同步越频繁。默认 0.1。
stamina_refill_interval: 0.100000001
# 体力补到多少。1 为满体力，可填 0.1~1 之间的值。
stamina_value: 1
# 是否输出调试日志（自动开门、补弹等）。
debug: false
